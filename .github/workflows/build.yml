name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ICcard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ICcard.apk \
            --title "最新ビルド #${{ github.run_number }}" \
            --notes "スマホでこのページを開いて ICcard.apk をタップ → インストール"
